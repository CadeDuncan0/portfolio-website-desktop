<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Super Mario Bros in Godot</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

html, body {
	height: 100%;
}

/* canvasResizePolicy 1 keeps the canvas backing store at the project's fixed
   resolution; CSS alone scales it to the window. Rendering cost stays constant
   no matter how large the window gets (the adaptive policy 2 re-allocated and
   re-rendered the framebuffer at full window resolution every resize frame).
   !important: the engine writes the project size into the canvas's inline
   style, which would otherwise beat this rule and crop instead of scale. */
#canvas {
	display: block;
	width: 100% !important;
	height: 100% !important;
	object-fit: contain;
	image-rendering: pixelated;
}

#canvas:focus {
	outline: none;
}

/* ── Win7-themed boot overlay ──────────────────────────────────────────────
   Hand-edit, like the #canvas rule above: re-apply after any Godot re-export.

   The default export shows the splash on a #242424 field with a bare UA
   <progress>. That reads as "some engine is loading", not as an application
   starting inside the desktop, and the grey clashed with the black the host
   iframe paints before this document parses.

   This document is same-origin but separate, so it cannot see the app's CSS
   custom properties — the Aero values below are copied from 7.css
   (--w7-pg-bg #0bd82c and the [role=progressbar] gradients) and must be
   updated by hand if that dependency is restyled. Kept in sync with
   MarioWindow.module.css .gameFrame, which paints the same backdrop.
   ------------------------------------------------------------------------ */

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	/* Matches .gameFrame's background so there is no flash when this document
	   paints over the host iframe. */
	background-color: #000;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
	image-rendering: pixelated;
}

#status-progress, #status-notice, #status-label {
	display: none;
}

#status-label {
	position: absolute;
	bottom: calc(10% + 24px);
	left: 0;
	right: 0;
	color: #f0f0f0;
	font: 9pt "Segoe UI", "SegoeUI", "Noto Sans", sans-serif;
	text-align: center;
	text-shadow: 0 1px 2px #000;
	z-index: 1;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
	/* Strip the UA widget so the trough/fill below are the only chrome. */
	appearance: none;
	-webkit-appearance: none;
	height: 15px;
	border: 1px solid #8e8f8f;
	border-radius: 3px;
	box-shadow: inset 0 0 0 1px #f3f3f388, 0 0 0 1px #eaeaea88;
	overflow: hidden;
}

/* Trough. Firefox styles the element itself; WebKit/Blink needs -webkit-progress-bar. */
#status-progress,
#status-progress::-webkit-progress-bar {
	background:
		radial-gradient(circle at 0 50%, #0000001f 10px, transparent 30px),
		radial-gradient(circle at 100% 50%, #0000001f 10px, transparent 30px),
		linear-gradient(180deg, #f3f3f3af, #fcfcfcaf 3px, #dbdbdbaf 6px, #cacacaaf 0, #d5d5d5af),
		#ddd;
}

/* Aero green fill with the glossy top band. */
#status-progress::-webkit-progress-value {
	background-color: #0bd82c;
	background-image:
		linear-gradient(180deg, #f3f3f3af, #fcfcfcaf 3px, #dbdbdbaf 6px, transparent 0),
		linear-gradient(180deg, transparent 65%, #ffffff55);
	box-shadow: inset 0 0 0 1px #ffffff1f;
}

#status-progress::-moz-progress-bar {
	background-color: #0bd82c;
	background-image:
		linear-gradient(180deg, #f3f3f3af, #fcfcfcaf 3px, #dbdbdbaf 6px, transparent 0),
		linear-gradient(180deg, transparent 65%, #ffffff55);
	box-shadow: inset 0 0 0 1px #ffffff1f;
}

/* Indeterminate: Godot drops value/max until the first byte totals arrive. */
#status-progress:not([value]) {
	background-image: linear-gradient(90deg, transparent, #0bd82c88, transparent 35%);
	background-repeat: no-repeat;
	background-size: 40% 100%;
	animation: progressbar 3s linear infinite;
}

@keyframes progressbar {
	0% { background-position: -40% 0; }
	100% { background-position: 140% 0; }
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" src="index.png" alt="">
			<!-- No trailing ellipsis: the title already ends in a period, and the
			     progress bar below conveys that work is in flight. -->
			<div id="status-label">Loading Super Mario Bros.</div>
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":1,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":8316288,"index.wasm":35376909},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	// Hand-added alongside the Win7 overlay styling — see the CSS note above.
	const statusLabel = document.getElementById('status-label');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusLabel.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occured');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				navigator.serviceWorker.getRegistration().then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).catch((err) => {
				console.error('Error while registering service worker:', err);
			}).then(() => {
				window.location.reload();
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
