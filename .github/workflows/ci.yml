# Human-readable workflow name shown in the Actions tab.
# This is not an identifier — the filename determines uniqueness.
name: CI

# Triggers: when GitHub should execute this workflow.
# pull_request → runs on the PR's merge commit (the integrated result).
# push to main → runs after merge, verifying the post-merge state.
on:
  pull_request:
    branches: [main, 'Phase*']
  push:
    branches: [main, 'Phase*']

# Concurrency control: if a new commit is pushed to the same PR branch
# while a previous run is still executing, cancel the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Job name shown in the Checks UI. This is the string you reference
    # when configuring Required Status Checks in branch protection.
    name: Build
    runs-on: ubuntu-latest

    steps:
      # Step 1 — Check out the repository at the PR's merge commit.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2 — Install Node.js and enable npm caching.
      # node-version '20' matches the win7-web-os template baseline.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3 — Install dependencies deterministically.
      # npm ci installs exact versions from package-lock.json and fails if it
      # is out of sync with package.json.
      - name: Install dependencies
        run: npm ci

      # Step 4 — Build the Next.js production bundle.
      # `next build` runs type-checking, route analysis, and bundle generation —
      # a comprehensive integration check. The template ships no ESLint/Prettier
      # config, so linting/format steps are intentionally omitted.
      #
      # NOTE: module-scope `createClient()` (src/lib/auth.ts, useAuthListener.ts)
      # means prerendering requires the Supabase env vars even at build time.
      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_ADMIN_EMAIL: ${{ secrets.NEXT_PUBLIC_ADMIN_EMAIL }}
